[package]
name = "telecommande-host"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serveur HTTPS + WebSocket (signalisation)
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.5", features = ["fs"] }
# Capture + encodage + WebRTC (phase 1).
# gstreamer-webrtc et gstreamer-sdp : types SDP / DataChannel de webrtcbin.
# futures-util : couper le WebSocket pour envoyer l'offre pendant qu'on lit la réponse.
gstreamer = "0.23"
gstreamer-sdp = "0.23"
gstreamer-webrtc = "0.23"
futures-util = "0.3"
# Entrées uinput (phase 3)
evdev = "0.12"
# Placer le curseur (warp) et taper au clavier (XTest).
x11rb = { version = "0.13", features = ["xtest"] }
# Disposition du clavier : une lettre devient le bon keycode (AZERTY compris).
xkbcommon = "0.7"
# Appairage : jeton aléatoire, QR terminal, certificat auto-signé
rand = "0.8"
hex = "0.4"
qrcode = { version = "0.14", default-features = false }
rcgen = "0.13"
# CLI, config, sérialisation, logs
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
